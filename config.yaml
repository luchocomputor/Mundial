bzzoiro:
  token: ""   # déplacé vers .env
  base_url: "https://sports.bzzoiro.com/api/v2"

api_football:
  key: ""
  base_url: "https://v3.football.api-sports.io"   # API-Sports direct (header x-apisports-key) · clé dans .env

telegram:
  chat_id: ""

model:
  min_edge_threshold: 0.05
  kelly_fraction: 0.25
  max_kelly_bet: 0.05
  decay: 0.0065
  friendly_weight: 0.5
  devig_method: "shin"
  max_market_divergence: 0.15
  market_anchor_weight: 0.3
  sparse_match_threshold: 5
  sparse_anchor_weight: 0.5
  production_mode: paper_only
  # O/U désactivé : l'Elo a un total de buts constant (mu+nu=BASE_GOALS) → aucune
  # résolution O/U, et le Dixon-Coles actuel est biaisé under. On ne parie pas ce
  # qu'on ne sait pas pricer. Réactiver quand un modèle buts attaque/défense est
  # validé (1X2 et BTTS, eux, gardent leur résolution → restent actifs).
  over_under_enabled: false

odds_api:
  key: ""   # déplacé vers .env
  base_url: "https://api.the-odds-api.com/v4"
  sport: "soccer_fifa_world_cup"
  regions: "eu"
bankroll:
  initial: 200

leagues:
  world_cup: 27
  friendlies: 31

seasons:
  training: [2018, 2019, 2020, 2021, 2022]
  backtest: 2022
  live: 2026

blend:
  dc_weight: 0.3

risk:
  max_daily_exposure: 0.15
  max_drawdown: 0.35
