name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m py_compile models/*.py pipeline/*.py odds/*.py evaluation/*.py backtest/*.py
      - name: Test
        run: pytest tests/ -v
        env:
          BZZOIRO_TOKEN: test_token_for_ci
      - name: Go/No-Go gate (structure)
        run: python -c "from backtest.go_nogo import evaluate, GoNoGoDecision; assert evaluate({'n_bets': 0}) == GoNoGoDecision.NO_GO"
        env:
          BZZOIRO_TOKEN: test_token_for_ci
